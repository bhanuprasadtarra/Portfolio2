# This workflow builds the React application and deploys the 'dist' folder
# to a separate public repository.
name: Build and Deploy to Public Repo

on:
  # Runs on pushes targeting the main branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to public repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          # Replace with your public repository name
          external_repository: bhanuprasadtarra/Portfolio
          # The branch in the public repository to deploy to
          publish_branch: main
          # The directory to deploy
          publish_dir: ./dist
          # The commit message
          commit_message: "Deploy: ${{ github.event.head_commit.message }} [${{ github.sha }}]"